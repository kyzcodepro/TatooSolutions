<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre devis — Inkflow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖋️</text></svg>">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .price-line { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline;
    padding: 0.6rem 0; border-bottom: 1px dashed var(--line); }
  .price-line:last-child { border-bottom: 0; }
  .price-total { font-size: 1.6rem; font-weight: 680; letter-spacing: -0.025em; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark">IF</span> Inkflow</a>
    <nav class="nav"><span class="muted" id="nav-studio"></span></nav>
  </div>
</header>

<main class="wrap-narrow" style="padding:2.5rem 0 4rem">
  <div id="loading" class="empty">Chargement…</div>
  <div id="view" class="hidden">
    <div class="steps" id="steps" style="margin-bottom:1.8rem"></div>
    <h1 class="display" id="headline"></h1>
    <p class="lede" id="subline"></p>
    <div id="panel" class="stack" style="margin-top:1.6rem"></div>
  </div>
</main>

<script type="module" src="/assets/quote.js"></script>
</body>
</html>
